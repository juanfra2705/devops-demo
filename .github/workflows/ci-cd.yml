
name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - run: npm test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Simular despliegue
        run: |
          mkdir -p production
          cp src/index.js src/production/
          VERSION=$(date +"%Y-%m-%d %H:%M:%S")
          echo "// Despliegue: $VERSION" > production/index.js
          cat src/index.js >> production/index.js
          echo "✅ App desplegada con marca de tiempo en entorno de producción"
          cat production/index.js
